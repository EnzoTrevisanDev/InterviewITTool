services:
  postgres:
    image: postgres:16
    container_name: interview_postgres
    restart: always
    environment:
      POSTGRES_USER: interview
      POSTGRES_PASSWORD: interview
      POSTGRES_DB: interview_platform
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    container_name: interview_redis
    restart: always
    ports:
      - "6379:6379"